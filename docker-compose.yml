services:
  postgres:
    image: postgres:17-alpine
    container_name: snapgis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapgis}
      POSTGRES_USER: ${POSTGRES_USER:-snapgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapgis_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: snapgis_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MinIO root user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MinIO root secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MinIO root user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MinIO root secret}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MinIO app user}
      MINIO_APP_SECRET: ${MINIO_APP_SECRET:?Set MinIO app secret}
      S3_BUCKET: ${S3_BUCKET:-snapgis-files}
    volumes:
      - ./ops/minio-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

volumes:
  minio_data:
  postgres_data:
  redis_data:
